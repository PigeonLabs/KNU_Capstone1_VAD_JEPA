[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ipad-jepa"
version = "0.1.0"
description = "Reproducible IPAD decoder-free phase-conditioned prototype experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.5", "matplotlib>=3.8", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
gpu = ["torch==2.8.0", "torchvision==0.23.0", "timm>=1.0.20", "einops>=0.8", "huggingface-hub>=0.30"]

[project.scripts]
ipad-audit = "ipad_jepa.audit:main"
ipad-plot-audit = "ipad_jepa.plot_audit:main"
ipad-upload-check = "ipad_jepa.upload_guard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
